[build-system]
requires = ["hatchling>=1.18"]
build-backend = "hatchling.build"

[project]
name = "nothierly"
version = "0.1.0"
description = "Official Python SDK for Nothierly's institutional market-data API."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Proprietary" }
authors = [{ name = "Nothierly" }]
dependencies = [
    "httpx>=0.24,<1.0",
    "pandas>=1.5,<3.0",
    "pydantic>=2.0,<3.0",
    "tenacity>=8.2,<9.0",
]

[tool.hatch.build.targets.wheel]
packages = ["nothierly"]
